<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabled Farse Fantasy Football Recaps</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; margin: 0; }
    .header { background: #111827; color: white; padding: 40px 20px; text-align: center; }
    .header h1 { margin: 0 0 10px; font-size: 32px; }
    .header p { margin: 0; opacity: 0.8; }
    .container { max-width: 850px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { margin-top: 0; }
    .message { text-align: center; padding: 30px 20px; color: #4b5563; }
    .footer { text-align: center; color: #6b7280; padding: 30px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏈 Fabled Farse Fantasy Football</h1>
    <p>Weekly League Recaps</p>
  </div>

  <div class="container">
    <div class="card">
      <h2>📣 2026 Season</h2>
      <div class="message">
        <p><strong>Season recaps are coming soon.</strong></p>
        <p>Check back here each week for the latest Fabled Farse fantasy football recap.</p>
      </div>
    </div>

    <div class="card">
      <h2>📚 Recap Archive</h2>
      <div class="message">
        <p>No recaps have been published yet.</p>
      </div>
    </div>
  </div>

  <div class="footer">
    Fabled Farse Fantasy Football • 2026 Season
  </div>
</body>
</html>
